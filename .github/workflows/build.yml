name: Build CONSTELLATION

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: |
          mkdir -p dist/CONSTELLATION-macOS
          cp -R build/Constellation_artefacts/Release/VST3/Constellation.vst3 dist/CONSTELLATION-macOS/
          cp -R build/Constellation_artefacts/Release/AU/Constellation.component dist/CONSTELLATION-macOS/
          codesign --force --deep -s - dist/CONSTELLATION-macOS/Constellation.vst3
          codesign --force --deep -s - dist/CONSTELLATION-macOS/Constellation.component
          cp installer/install-mac.command dist/CONSTELLATION-macOS/
          chmod +x dist/CONSTELLATION-macOS/install-mac.command
          cp docs/manual/*.pdf dist/CONSTELLATION-macOS/ || true
          cd dist && ditto -c -k --keepParent CONSTELLATION-macOS CONSTELLATION-macOS.zip

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CONSTELLATION-Windows | Out-Null
          Copy-Item -Recurse build/Constellation_artefacts/Release/VST3/Constellation.vst3 dist/CONSTELLATION-Windows/
          Copy-Item installer/install-windows.bat dist/CONSTELLATION-Windows/
          Copy-Item docs/manual/*.pdf dist/CONSTELLATION-Windows/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/CONSTELLATION-Windows -DestinationPath dist/CONSTELLATION-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CONSTELLATION-${{ matrix.name }}
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
